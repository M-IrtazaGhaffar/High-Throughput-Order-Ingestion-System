# Allow the default "guest" user to connect from non-localhost
# By default RabbitMQ restricts guest to localhost only (security measure)
loopback_users.guest = false

# Memory usage threshold (40% of available RAM)
# When exceeded, RabbitMQ will block publishers to prevent crashes
# Too low = throttling early, too high = risk of OOM
vm_memory_high_watermark.relative = 0.4

# Disk free space threshold (100% of RAM size)
# If disk space drops below this, RabbitMQ blocks publishers
# Prevents data loss due to disk exhaustion
disk_free_limit.relative = 1.0

# Heartbeat interval in seconds
# Detects dead TCP connections between client and broker
# Lower = faster detection, higher = less network overhead
heartbeat = 30

# Consumer timeout in milliseconds (300,000 ms = 5 minutes)
# If a consumer does not acknowledge a message within this time, it gets cancelled
# Helps avoid stuck/unresponsive consumers blocking queues
consumer_timeout = 300000